apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    version: {{ .Values.image.tag | quote }}
    managed-by: helm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: {{ .Values.image.tag | quote }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__MargBooksDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.secretKey }}
            - name: RunMigrationsOnStartup
              value: {{ .Values.runMigrationsOnStartup | quote }}
            - name: EnableSwagger
              value: {{ .Values.enableSwagger | quote }}
            {{- range $i, $origin := .Values.cors.allowedOrigins }}
            - name: Cors__AllowedOrigins__{{ $i }}
              value: {{ $origin | quote }}
            {{- end }}
            - name: Services__Catalog
              value: {{ .Values.services.catalog | quote }}
            - name: Services__Customer
              value: {{ .Values.services.customer | quote }}
            - name: Services__Notification
              value: {{ .Values.services.notification | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.liveness }}
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.health.readiness }}
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
