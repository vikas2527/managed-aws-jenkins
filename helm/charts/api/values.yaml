# Default values — overridden by values-dev.yaml and values-prod.yaml

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  annotations: {}
  host: ""
  paths: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Database connection string — injected via Kubernetes secret
# Create secret before deploying:
# kubectl create secret generic margbooks-db-secret \
#   --from-literal=connection-string="Host=RDS_HOST;Port=5432;Database=margbooksdb;Username=margbooks;Password=PASSWORD;SslMode=Require" \
#   --namespace margbooks-dev
db:
  secretName: margbooks-db-secret
  secretKey: connection-string

# Service-to-service URLs for order-api (uses Kubernetes DNS)
services:
  catalog:      "http://catalog-api"
  customer:     "http://customer-api"
  notification: "http://notification-api"

# CORS allowed origins
cors:
  allowedOrigins:
    - "*"

# Health check paths
health:
  liveness:  /health/live
  readiness: /health/ready

# Run EF Core migrations on startup
runMigrationsOnStartup: true

# Enable Swagger UI
enableSwagger: true
